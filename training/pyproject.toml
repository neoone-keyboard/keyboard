[project]
name = "mlkb"
version = "0.1.0"
description = "Training and evaluation for the keyboard's neural models"
requires-python = ">=3.12"
dependencies = ["mlengine", "numpy>=2"]

[dependency-groups]
dev = ["pytest>=8"]
train = ["torch>=2.5"]
spike = ["coremltools>=8"]

[tool.uv.sources]
mlengine = { path = "../engine/py" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
