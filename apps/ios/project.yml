name: MLKeyboard
options:
  bundleIdPrefix: me.jishnu.keyboard
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: Z52A4S8VKP
packages:
  KeyboardCore:
    path: Packages/KeyboardCore
  MLEngine:
    path: Packages/MLEngine
targets:
  KeyboardApp:
    type: application
    platform: iOS
    sources: [KeyboardApp]
    scheme: {}
    info:
      path: KeyboardApp/Info.plist
      properties:
        CFBundleDisplayName: Malayalam Keyboard
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.jishnu.keyboard
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: KeyboardExtension
  KeyboardExtension:
    type: app-extension
    platform: iOS
    sources: [KeyboardExtension]
    info:
      path: KeyboardExtension/Info.plist
      properties:
        CFBundleDisplayName: Malayalam Keyboard
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: ml
            RequestsOpenAccess: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.jishnu.keyboard.extension
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: KeyboardCore
      - package: MLEngine
