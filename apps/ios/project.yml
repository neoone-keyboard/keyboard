name: MLKeyboard
options:
  deploymentTarget:
    iOS: "26.0"
# The signing team and the identifiers (DEVELOPMENT_TEAM, BUNDLE_ID_PREFIX, APP_GROUP) come from
# Signing.xcconfig, which a git-ignored Signing.local.xcconfig overrides. Nothing below names them.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    # The App Store version and build, shared by the app and the keyboard (App Store Connect
    # rejects an extension whose version or build differs from the app's). `make testflight
    # BUILD=n` overrides the build number for an upload; each upload needs a new one.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  KeyboardCore:
    path: Packages/KeyboardCore
  MLEngine:
    path: Packages/MLEngine
targets:
  KeyboardApp:
    type: application
    platform: iOS
    sources:
      - path: KeyboardApp
        excludes: ["SpikeAssets"]
      # Debug-only runtime spike models (`make spike-assets`; git-ignored). A folder reference,
      # so the compiled .mlmodelc is copied as is.
      - path: KeyboardApp/SpikeAssets
        type: folder
        buildPhase: resources
        optional: true
    scheme:
      testTargets: [KeyboardAppTests, KeyboardUITests]
    # Installed language packs (M6 phase 3) live in the App Group's Packs/: the app writes them,
    # the keyboard reads them (no Full Access needed for reading).
    # The entitlements and Info.plist files are written by xcodegen (`make project`) from these
    # properties and are git-ignored; edit them here.
    entitlements:
      path: KeyboardApp/KeyboardApp.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    info:
      path: KeyboardApp/Info.plist
      properties:
        CFBundleDisplayName: NeoOne Keyboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The commit `make` built from, shown with the version on the home screen and in
        # About (KeyboardCore AppVersion; empty otherwise).
        MLGitCommit: $(ML_GIT_COMMIT)
        UILaunchScreen: {}
        # HTTPS through URLSession only (the pack downloads): exempt from export documentation.
        ITSAppUsesNonExemptEncryption: false
        # neoone://languages opens the Languages screen (the keyboard settings panel's row).
        CFBundleURLTypes:
          - CFBundleURLName: $(BUNDLE_ID_PREFIX)
            CFBundleURLSchemes: [neoone]
        # The pack index (index.json) the Languages and first-launch screens download from:
        # ML_PACK_INDEX_URL, from PackIndex.xcconfig (`make site-packs`, from site-src/site.json).
        # Empty hides the download section.
        NeoPackIndexURL: $(ML_PACK_INDEX_URL)
        # The App Group (Signing.xcconfig), for KeyboardCore PackLocations.appGroup.
        NeoAppGroup: $(APP_GROUP)
        # The .neopack file (a zip of a pack folder), for the Files import's document picker
        # (KeyboardCore PackImport.contentType reads the identifier back from here).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: $(BUNDLE_ID_PREFIX).neopack
            UTTypeDescription: NeoOne Keyboard language pack
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [neopack]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        # Assets.xcassets: the NEO1 icon, rendered by tools/icon/render.sh (`make icon`).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    # ML_PACK_INDEX_URL, the pack index's https URL (generated; see NeoPackIndexURL above).
    configFiles:
      Debug: PackIndex.xcconfig
      Release: PackIndex.xcconfig
    postBuildScripts:
      # The spike models are copied whenever SpikeAssets/ exists; only Debug shows the view
      # that uses them, so other configurations drop them (8.9 MB of unused models).
      - name: Strip spike models outside Debug
        script: |
          if [ "$CONFIGURATION" != "Debug" ]; then
            rm -rf "$TARGET_BUILD_DIR/$WRAPPER_NAME/SpikeAssets"
          fi
        basedOnDependencyAnalysis: false
    dependencies:
      - target: KeyboardExtension
      - package: KeyboardCore
      # For the debug-only runtime spike (RuntimeSpikeView).
      - package: MLEngine
  KeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: KeyboardExtension
        excludes: ["Lexicon", "Models", "Emoji"]
      # A folder reference: the .fst files land in the bundle under Lexicon/.
      - path: KeyboardExtension/Lexicon
        type: folder
        buildPhase: resources
      # The emoji panel and the emoji suggestions (`make emoji`), in the bundle under Emoji/.
      - path: KeyboardExtension/Emoji
        type: folder
        buildPhase: resources
    # Reads the packs the app installs (App Group Packs/); never writes there.
    entitlements:
      path: KeyboardExtension/KeyboardExtension.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    info:
      path: KeyboardExtension/Info.plist
      properties:
        CFBundleDisplayName: NeoOne Keyboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The commit `make` built from, for the settings panel's version line and the
        # diagnostics report (empty otherwise).
        MLGitCommit: $(ML_GIT_COMMIT)
        # Debug only: the active languages to set at open ("ml,hi"); empty keeps the engine's
        # default. `make twopacks` sets it with ML_DEBUG_PACKS.
        MLActiveLanguages: $(ML_ACTIVE_LANGUAGES)
        # The App Group (Signing.xcconfig), for KeyboardCore PackLocations.appGroup.
        NeoAppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: mul
            RequestsOpenAccess: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).extension
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        # The debug-only two-pack switch (scripts/debug-packs.sh), off by default: extra pack
        # ids to bundle beside ml (which every Debug build bundles; Release bundles no pack),
        # and the active list to set.
        ML_DEBUG_PACKS: ""
        ML_ACTIVE_LANGUAGES: ""
    postBuildScripts:
      # The bundled packs, Debug only: Malayalam and ML_DEBUG_PACKS. Release builds bundle
      # none, so a new user downloads their languages. Removes any left by an earlier build.
      - name: Debug packs
        script: '"$SRCROOT/../../scripts/debug-packs.sh"'
        basedOnDependencyAnalysis: false
    dependencies:
      - package: KeyboardCore
      - package: MLEngine
  # Run inside the app on a simulator (`make test-app`): importing a language pack with real
  # files, into the simulator's App Group and through the engine's check (the pack is the
  # engine's small Gujarati test pack, a folder in the test bundle); and the keyboard's
  # suggestion bar as a view, its source compiled into the test bundle.
  KeyboardAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KeyboardAppTests
      - path: TestSupport
      - path: KeyboardExtension/TopBarView.swift
      - path: KeyboardExtension/KeyboardTheme.swift
      - path: ../../engine/core/tests/fixtures/gu.neopack
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/KeyboardApp.app/KeyboardApp
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: KeyboardApp
  # The app's screens and the keyboard's settings panel, on a simulator where NeoOne Keyboard
  # is added in Settings. SHOTS_DIR (TEST_RUNNER_SHOTS_DIR=… on xcodebuild) saves screenshots.
  KeyboardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KeyboardUITests
      # The test pack the import test saves in Files (TestSupport/TestPackFile.swift).
      - path: TestSupport
      - path: ../../engine/core/tests/fixtures/gu.neopack
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).uitests
        TEST_TARGET_NAME: KeyboardApp
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: KeyboardApp
