# Hindi pack lexicons (data/build-pack-lexicons.sh hi).
# Wiki dumps (manifest ids) and the extra namespaces to read in each, as id[:namespaces].
# Hindi Wikisource's proofread text is in the Page namespace, key 250 (पृष्ठ).
WIKIS="hiwiki hiwikisource:250,पृष्ठ"
# The romanised lexicon's file name, without .fst (packs/hi.neopack/manifest.json, files.romanisedLexicon).
ROMANISED=hinglish
