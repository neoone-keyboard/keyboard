[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "mlengine"
version = "0.1.0"
requires-python = ">=3.12"

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "mlengine"

# uv caches path builds: rebuild whenever the engine's Rust sources change.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../core/Cargo.toml" },
    { file = "../core/src/**/*.rs" },
    # Compiled into the engine: the embedded script rules and Malayalam's fromLatin.
    { file = "../../data/langs/ml/lang.json" },
    { file = "../../data/langs/hi/lang.json" },
    { file = "../../data/langs/as/lang.json" },
    { file = "../../packs/ml.neopack/romanisation.json" },
]
