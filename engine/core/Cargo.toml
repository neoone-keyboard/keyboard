[package]
name = "mlengine-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "mlengine_core"

[dependencies]
fst = "0.4"
memmap2 = "0.9"
unicode-normalization = "0.1"
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"
serde_json = "1"
tempfile = "3"
