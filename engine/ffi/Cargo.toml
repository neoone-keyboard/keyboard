[package]
name = "mlengine-ffi"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "mlengine_ffi"
# staticlib → the XCFramework; cdylib → host library that uniffi-bindgen reads.
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
required-features = ["cli"]
path = "src/bin/uniffi-bindgen.rs"

[features]
cli = ["uniffi/cli"]

[dependencies]
mlengine-core = { path = "../core" }
thiserror = "2"
uniffi = "0.29"
